<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste · vulnerabilidade</title>
  <link rel="stylesheet" href="../vendor/fontes/globo.css">
  <link rel="stylesheet" href="../vendor/fontes/painel.css">
  <link rel="stylesheet" href="../css/quadra.css">
  <link rel="stylesheet" href="../css/extras/vulnerabilidade.css">
</head>
<body>
  <main class="jornada">
    <p class="kicker" id="info">teste do extra vulnerabilidade · ?cod=2311306&amp;vista=agua|seca|geada&amp;terra=nao_sei|arenosa|mista|barro&amp;baixio=1|0</p>
    <div id="alvo"></div>
  </main>
  <script type="module">
    import * as U from "../js/comum.js";
    import mod from "../js/extras/vulnerabilidade.js";
    const q = new URLSearchParams(location.search);
    const cod = q.get("cod") || "2311306";
    const temBx = q.get("baixio") !== "0";
    const r = await fetch(`/api/local?cod=${cod}`).then((x) => x.json());
    if (q.get("semplano") === "1") { r.plano = null; r.agenda = null; r.cardapio = []; } // degradação: sem plano, sem calendário, sem ZARC
    const ctx = {
      r, cod,
      ef: { ha: 3, baixio_ha: temBx ? 1 : 0, baixio_frac: temBx ? 1 / 3 : 0, tem_baixio: temBx, baixio: temBx ? "terco" : "nao", terra: q.get("terra") || "nao_sei",
        agua: "chuva", maniva: "tem", prioridade: "garantir", raiz: "uf_mediana", custo: "semente" },
      resp: {}, util: U, set() {}, ir() {}, link() { return "#"; },
    };
    document.getElementById("info").textContent = `${r.local.municipio}-${r.local.uf} (${cod})`;
    await mod.render(document.getElementById("alvo"), ctx, { vista: q.get("vista") || "agua" });
    window.__pronto = true;
  </script>
</body>
</html>
