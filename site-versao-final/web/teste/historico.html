<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040605">
  <title>QUADRA · teste histórico</title>
  <link rel="stylesheet" href="../vendor/fontes/globo.css">
  <link rel="stylesheet" href="../vendor/fontes/painel.css">
  <link rel="stylesheet" href="../css/quadra.css">
  <link rel="stylesheet" href="../css/extras/voce_decide.css">
  <link rel="stylesheet" href="../css/extras/area_historico.css">
  <style>
    .teste-barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 28px; font-size: 13px; color: var(--muted); }
    .teste-barra a { color: var(--ink-2); }
    .teste-sec { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-4);
      border-top: 1px dashed var(--border-2); padding-top: 10px; margin: 30px 0 12px; }
    .teste-resp { font-family: var(--mono); font-size: 12px; color: var(--ink-4); margin: 18px 0 0; word-break: break-all; }
    @media (max-width: 760px) { .teste-barra { padding: 10px 16px; } }
  </style>
</head>
<body>
  <!-- Teste do módulo js/extras/historico.js, fora da jornada. Parâmetros: ?cod=<IBGE>&modo=todos|pergunta|cartao|memoria
       &antes=<texto>&exp=<texto>&hoje=<texto de ctx.resp.hoje>&tela=0..3&maniva=tem|nao|plantada -->
  <div class="teste-barra" id="barra"></div>
  <main class="jornada">
    <p class="teste-sec" id="sec-pergunta">modo "pergunta"</p>
    <div id="pergunta"></div>
    <p class="teste-sec" id="sec-cartao">modo "cartao" (passo 3)</p>
    <div id="cartao"></div>
    <p class="teste-sec" id="sec-memoria">modo "memoria" (passo 5)</p>
    <div id="memoria"></div>
    <p class="teste-resp" id="resp"></p>
  </main>
  <script type="module">
    import * as U from "../js/comum.js";
    import mod from "../js/extras/historico.js";

    const q = new URLSearchParams(location.search);
    const cod = q.get("cod") || "2311306", modo = q.get("modo") || "todos";
    const resp = { antes: q.get("antes") || "", exp: q.get("exp") || "", hoje: q.get("hoje") || "", maniva: q.get("maniva") || "" };
    const ef = { ha: 3, baixio_ha: 1, baixio_frac: 1 / 3, tem_baixio: true, terra: "nao_sei", agua: "chuva", maniva: resp.maniva || "tem",
      prioridade: "garantir", raiz: "uf_mediana", custo: "semente" };
    const ex = [["2311306", "Quixadá"], ["2700300", "Arapiraca"], ["2903201", "Barreiras"]];
    const presets = [
      [{ antes: "", exp: "", hoje: "" }, "vazio"],
      [{ antes: "2026:milho|2025:milho", exp: "quebra=milho:2024:seca", hoje: "" }, "milho 2026 e 2025, quebrou 2024 (seca)"],
      [{ antes: "2026:milho,feijao,mandioca|2025:milho,feijao", exp: "bem=feijao,mandioca|quebra=milho:2016:seca,feijao::praga|faz=esterco|roca=enxada",
        hoje: "milho:40,feijao:30,mandioca:30|cons=1|queima=1|sem=1" }, "com mandioca e queima"],
    ];
    const url = (p) => { const n = new URLSearchParams(q); for (const [k, v] of Object.entries(p)) v === "" ? n.delete(k) : n.set(k, v); return "?" + n; };
    document.getElementById("barra").innerHTML = `<b>teste histórico</b> ${ex.map(([c, n]) => `<a href="${url({ cod: c })}">${n}</a>`).join(" · ")}
      · ${presets.map(([p, n]) => `<a href="${url(p)}">${n}</a>`).join(" · ")}
      · modo: ${["todos", "pergunta", "cartao", "memoria"].map((m) => `<a href="${url({ modo: m === "todos" ? "" : m })}">${m}</a>`).join(" · ")}`;
    for (const m of ["pergunta", "cartao", "memoria"]) if (modo !== "todos" && modo !== m) ["sec-" + m, m].forEach((i) => (document.getElementById(i).hidden = true));

    let r = null, primeira = true;
    const ctx = () => ({ r, cod, ef, resp: { ...resp }, util: U, entrou: primeira,
      set(p) {
        Object.assign(resp, p);
        if (p.maniva) ef.maniva = p.maniva;
        history.replaceState(null, "", url(resp));
        setTimeout(desenhar, 0); // como o roca.js: redesenha depois
      },
      ir() {}, link() { return "#"; } });
    async function desenhar() {
      const c = ctx(), tela = q.has("tela") ? +q.get("tela") : undefined;
      if (modo === "todos" || modo === "pergunta") await mod.render(document.getElementById("pergunta"), c, { modo: "pergunta", tela });
      if (modo === "todos" || modo === "cartao") await mod.render(document.getElementById("cartao"), c, { modo: "cartao" });
      if (modo === "todos" || modo === "memoria") await mod.render(document.getElementById("memoria"), c, { modo: "memoria" });
      document.getElementById("resp").textContent = Object.entries(resp).map(([k, v]) => `${k} = "${v}"`).join(" · ");
      primeira = false;
    }
    try {
      const resp0 = await fetch(`/api/local?cod=${cod}`);
      r = await resp0.json();
      if (r.erro) throw new Error(r.erro);
      await desenhar();
    } catch (e) {
      document.querySelector("main").innerHTML = `<div class="erro">Não consegui carregar: ${U.esc(e.message)}. O servidor está rodando (porta 8090)?</div>`;
      console.error(e);
    }
  </script>
</body>
</html>
