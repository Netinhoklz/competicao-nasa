<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste · harmonização</title>
  <!-- base em web/: o módulo busca "dados/..." relativo a roca.html -->
  <base href="../">
  <link rel="stylesheet" href="vendor/fontes/globo.css">
  <link rel="stylesheet" href="vendor/fontes/painel.css">
  <link rel="stylesheet" href="css/quadra.css">
  <link rel="stylesheet" href="css/extras/harmonizacao.css">
</head>
<body>
  <main class="jornada"><div id="alvo"><div class="carregando">Carregando</div></div></main>
  <script type="module">
    // uso: teste/harmonizacao.html?cod=2311306&base=chuva|solo|clima|aptidao|verde|rocado&aberto=1
    import * as U from "./js/comum.js";
    import mod from "./js/extras/harmonizacao.js";
    const q = new URLSearchParams(location.search), cod = q.get("cod") || "2311306";
    const el = document.getElementById("alvo");
    try {
      const r = await fetch(`/api/local?cod=${cod}`).then((x) => x.json());
      const ctx = { r, cod, entrou: true, util: U, resp: {}, set() {}, ir() {}, link() { return "#"; },
        ef: { ha: +(q.get("ha") || 3), baixio_ha: 1, baixio_frac: 1 / 3, tem_baixio: true, terra: "nao_sei", agua: "chuva", maniva: "tem",
          prioridade: "garantir", raiz: "uf_mediana", custo: "semente" } };
      await mod.render(el, ctx, { base: q.get("base") || undefined });
      if (q.get("aberto")) el.querySelector("details.ver-mais")?.setAttribute("open", "");
      document.body.dataset.pronto = "1";
    } catch (e) {
      el.innerHTML = `<p class="erro">${U.esc(e.message)}</p>`;
      console.error(e);
    }
  </script>
</body>
</html>
