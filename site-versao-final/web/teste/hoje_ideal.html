<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040605">
  <title>QUADRA · teste hoje, melhor e ideal</title>
  <link rel="stylesheet" href="../vendor/fontes/globo.css">
  <link rel="stylesheet" href="../vendor/fontes/painel.css">
  <link rel="stylesheet" href="../css/quadra.css">
  <link rel="stylesheet" href="../css/extras/hoje_ideal.css">
  <style>
    .teste-barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 28px; font-size: 13px; color: var(--muted); }
    .teste-barra a { color: var(--ink-2); }
    .teste-sec { font-family: var(--mono); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-4);
      border-top: 1px dashed var(--border-2); padding-top: 10px; margin: 30px 0 0; }
    @media (max-width: 760px) { .teste-barra { padding: 10px 16px; } }
  </style>
</head>
<body>
  <!-- Teste do módulo js/extras/hoje_ideal.js, fora da jornada. Parâmetros: ?cod=<IBGE>&modo=ambos|pergunta|comparacao
       &hoje=<texto de ctx.resp.hoje>&tela=0..3&ha=3&baixio_ha=1&baixio=0&maniva=tem|nao|plantada
       &prioridade=garantir|equilibrar|vender&custo=semente|desembolso&raiz=uf_mediana|municipio|uf_p25&semfin=1 (sem série) -->
  <div class="teste-barra" id="barra"></div>
  <main class="jornada">
    <p class="teste-sec" id="sec-p">modo "pergunta"</p>
    <div id="pergunta"></div>
    <p class="teste-sec" id="sec-c">modo "comparacao"</p>
    <div id="comparacao"></div>
  </main>
  <script type="module">
    import * as U from "../js/comum.js";
    import mod from "../js/extras/hoje_ideal.js";

    const q = new URLSearchParams(location.search);
    const cod = q.get("cod") || "2311306", modo = q.get("modo") || "ambos";
    const resp = { hoje: q.get("hoje") || "" };
    const ef = { ha: +(q.get("ha") || 3), baixio_ha: +(q.get("baixio_ha") || 1), baixio_frac: 1 / 3, tem_baixio: q.get("baixio") !== "0",
      terra: "nao_sei", agua: "chuva", maniva: q.get("maniva") || "tem", prioridade: q.get("prioridade") || "garantir",
      raiz: q.get("raiz") || "uf_mediana", custo: q.get("custo") || "semente" };
    if (!ef.tem_baixio) ef.baixio_ha = 0;

    const ex = [["2311306", "Quixadá"], ["2700300", "Arapiraca"], ["2903201", "Barreiras"]];
    const presets = [["", "padrão"], ["milho:60,feijao:40|cons=0|mbx=1|1chuva=0|queima=1|sem=0", "milho no baixio, queima"],
      ["milho:40,feijao:30,mandioca:30|cons=1|queima=0", "com mandioca"]];
    const url = (p) => { const n = new URLSearchParams(q); for (const [k, v] of Object.entries(p)) v === "" ? n.delete(k) : n.set(k, v); return "?" + n; };
    document.getElementById("barra").innerHTML = `<b>teste</b> ${ex.map(([c, n]) => `<a href="${url({ cod: c })}">${n}</a>`).join(" · ")}
      · hoje: ${presets.map(([h, n]) => `<a href="${url({ hoje: h })}">${n}</a>`).join(" · ")} · <span id="txt-hoje"></span>`;

    let r = null, primeira = true;
    const ctx = () => ({ r, cod, ef, resp: { ...resp }, util: U, entrou: primeira,
      set(p) { Object.assign(resp, p); history.replaceState(null, "", url({ hoje: resp.hoje })); setTimeout(desenhar, 0); }, // como o roca.js: redesenha depois
      ir() {}, link() { return "#"; } });
    async function desenhar() {
      const c = ctx();
      document.getElementById("txt-hoje").textContent = `ctx.resp.hoje = "${resp.hoje}"`;
      const tela = q.has("tela") ? +q.get("tela") : undefined;
      if (modo !== "comparacao") await mod.render(document.getElementById("pergunta"), c, { modo: "pergunta", tela, linkComparacao: "#comparacao" });
      if (modo !== "pergunta") await mod.render(document.getElementById("comparacao"), c, { modo: "comparacao" });
      primeira = false;
    }
    for (const [m, ids] of [["comparacao", ["sec-p", "pergunta"]], ["pergunta", ["sec-c", "comparacao"]]]) if (modo === m) ids.forEach((i) => (document.getElementById(i).hidden = true));
    try {
      const resp0 = await fetch(`/api/local?cod=${cod}`);
      r = await resp0.json();
      if (r.erro) throw new Error(r.erro);
      if (q.get("semfin") === "1") r.financeiro = null;
      await desenhar();
    } catch (e) {
      document.querySelector("main").innerHTML = `<div class="erro">Não consegui carregar: ${U.esc(e.message)}. O servidor está rodando (porta 8090)?</div>`;
      console.error(e);
    }
  </script>
</body>
</html>
