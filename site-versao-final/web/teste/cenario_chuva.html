<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste · E se chover</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../vendor/fontes/globo.css">
  <link rel="stylesheet" href="../vendor/fontes/painel.css">
  <link rel="stylesheet" href="../css/quadra.css">
  <link rel="stylesheet" href="../css/extras/cenario_chuva.css">
</head>
<body>
  <!-- Teste do módulo extra js/extras/cenario_chuva.js. Uso: teste/cenario_chuva.html#2311306 (ou #2700300, #2903201);
       ?partes=cenario ou ?partes=sobreposicao para ver só uma parte. -->
  <main class="jornada"><div id="alvo" class="passo-conteudo"><div class="carregando">Carregando</div></div></main>
  <script type="module">
    import modulo from "../js/extras/cenario_chuva.js";
    import * as U from "../js/comum.js";
    const cod = location.hash.slice(1) || "2311306";
    const partes = new URLSearchParams(location.search).get("partes");
    const el = document.getElementById("alvo");
    try {
      const r = await fetch(`/api/local?cod=${cod}`).then((x) => x.json());
      const ctx = {
        r, cod, util: U, resp: {}, set() {}, ir() {}, link() { return "#"; },
        ef: { ha: 3, baixio_ha: 1, baixio_frac: 1 / 3, tem_baixio: true, terra: "nao_sei", agua: "chuva", maniva: "tem", prioridade: "garantir", raiz: "uf_mediana", custo: "semente" },
      };
      el.innerHTML = `<div class="titulo-passo"><p class="kicker">Teste · ${U.esc(r.local?.municipio)} (${U.esc(r.local?.uf)})</p>
        <h1>E se chover…<span class="eco">chuva, solo e colheita.</span></h1></div><div id="modulo"></div>`;
      await modulo.render(document.getElementById("modulo"), ctx, partes ? { partes: partes.split(",") } : {});
    } catch (e) {
      el.innerHTML = `<div class="erro">${U.esc(e.message)}</div>`;
      console.error(e);
    }
  </script>
</body>
</html>
