<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roça Certa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Jornada: 1) toque no mapa  2) confirme  3) cinco cartões visuais. Explicações ficam em "Como eu funciono".
   Tinta verde-petróleo da caatinga, azul de chuva, ocre de sol; semáforo separado do destaque. Letra grande, alvos grandes. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface2:#f3f6f4; --ink:#14211d; --muted:#55655e; --line:#d4ddd8;
  --accent:#0d5d63; --accent-ink:#ffffff; --rain:#2b6cb0; --sun:#c46a12;
  --ok:#23803a; --warn:#a86f00; --bad:#bf3a26; --ok-bg:#e2f2e5; --warn-bg:#fbefd3; --bad-bg:#fbe3de; --idle-bg:#e7ece9;
  --land:#dfe7e2; --land-hi:#bcd3c9;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --surface:#172020; --surface2:#1d2827; --ink:#e6ede9; --muted:#9fb2ab; --line:#2c3937;
    --accent:#52b8b5; --accent-ink:#04201f; --rain:#76b0f0; --sun:#f0a24f;
    --ok:#62cb73; --warn:#e8b93f; --bad:#f07a63; --ok-bg:#16301c; --warn-bg:#33290f; --bad-bg:#3a1c16; --idle-bg:#222d2b;
    --land:#26322f; --land-hi:#35504a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --surface:#172020; --surface2:#1d2827; --ink:#e6ede9; --muted:#9fb2ab; --line:#2c3937;
  --accent:#52b8b5; --accent-ink:#04201f; --rain:#76b0f0; --sun:#f0a24f;
  --ok:#62cb73; --warn:#e8b93f; --bad:#f07a63; --ok-bg:#16301c; --warn-bg:#33290f; --bad-bg:#3a1c16; --idle-bg:#222d2b;
  --land:#26322f; --land-hi:#35504a;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.45}
h1,h2,h3{font-family:var(--display); text-wrap:balance; margin:0; line-height:1.15}
a{color:var(--accent)}
button{font:inherit}
button:focus-visible, a:focus-visible, input:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
header{background:var(--accent); color:var(--accent-ink)}
.bar{max-width:980px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.logo{font-family:var(--display); font-weight:800; font-size:24px; color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px}
.logo svg{width:28px; height:28px}
.bar nav{display:flex; gap:6px; flex-wrap:wrap}
.bar nav a{color:inherit; text-decoration:none; font-weight:700; font-size:16px; padding:8px 12px; border-radius:999px}
.bar nav a[aria-current="page"]{background:rgba(255,255,255,.18)}
main{max-width:980px; margin:0 auto; padding:20px 16px 48px}
.steps{display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
.step{display:flex; align-items:center; gap:8px; color:var(--muted); font-weight:700; font-size:16px}
.step b{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--idle-bg); color:var(--muted); font-family:var(--display)}
.step.on{color:var(--ink)} .step.on b{background:var(--accent); color:var(--accent-ink)}
.mapbox{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden}
#mapa{width:100%; height:auto; display:block; touch-action:manipulation; max-height:72vh}
#mapa path{fill:var(--land); stroke:var(--surface); stroke-width:.7; cursor:pointer; vector-effect:non-scaling-stroke; transition:fill .15s}
#mapa path:hover{fill:var(--land-hi)}
#mapa path.on{fill:var(--accent); opacity:.35}
.find{position:absolute; top:12px; left:12px; right:12px; display:flex; gap:8px}
.find input{flex:1; min-width:0; font:inherit; font-size:17px; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.08)}
.sheet{position:absolute; left:12px; right:12px; bottom:12px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; box-shadow:0 6px 20px rgba(0,0,0,.14)}
.sheet[hidden]{display:none}
.sheet p{margin:0; font-size:17px}
.sheet b{font-family:var(--display); font-size:22px}
.btn{font-weight:700; border:0; background:var(--accent); color:var(--accent-ink); padding:14px 20px; border-radius:14px; cursor:pointer; font-size:18px; text-decoration:none; display:inline-block}
.btn.ghost{background:transparent; color:var(--accent); border:2px solid var(--accent); padding:12px 16px}
.hint{color:var(--muted); font-size:15px; margin:10px 2px 0}
.who{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.who h1{font-size:30px}
.who .sub{color:var(--muted); font-size:16px}
.who-l{display:flex; align-items:center; gap:12px}
.mini{width:104px; height:auto; flex:none}
.mini path{fill:var(--land); stroke:none} .mini path.on{fill:var(--accent)}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px}
@media (max-width:420px){ .grid{grid-template-columns:1fr} }
#mapa #pin path{fill:var(--sun); stroke:var(--surface); stroke-width:3; cursor:default}
.card{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px; display:flex; flex-direction:column; gap:12px}
.card-h{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.card-h h2{font-size:21px}
.why{flex:none; width:34px; height:34px; border-radius:50%; border:2px solid var(--line); background:var(--surface); color:var(--muted); font-weight:800; cursor:pointer; display:grid; place-items:center; text-decoration:none; font-size:17px}
.why:hover{border-color:var(--accent); color:var(--accent)}
.big{display:flex; align-items:center; gap:14px; border-radius:16px; padding:14px; border:2px solid transparent}
.big .dot{width:58px; height:58px; border-radius:50%; flex:none; display:grid; place-items:center; color:#fff}
.big .dot svg{width:32px; height:32px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.big strong{font-family:var(--display); font-size:24px; display:block; line-height:1.1}
.big span{font-size:16px}
.s-bad{background:var(--bad-bg); border-color:var(--bad)} .s-bad .dot{background:var(--bad)}
.s-warn{background:var(--warn-bg); border-color:var(--warn)} .s-warn .dot{background:var(--warn)}
.s-ok{background:var(--ok-bg); border-color:var(--ok)} .s-ok .dot{background:var(--ok)}
.s-idle{background:var(--idle-bg); border-color:var(--line)} .s-idle .dot{background:var(--muted)}
.cap{font-size:15px; color:var(--muted); margin:0}
.analog{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; align-items:end}
.analog div{display:flex; flex-direction:column; align-items:center; gap:4px; font-variant-numeric:tabular-nums}
.analog .col{width:100%; max-width:64px; height:90px; background:var(--surface2); border-radius:10px; position:relative; overflow:hidden}
.analog .col i{position:absolute; left:0; right:0; bottom:0; border-radius:10px}
.analog .col u{position:absolute; left:0; right:0; border-top:2px dashed var(--muted)}
.analog b{font-size:18px} .analog small{font-size:14px; color:var(--muted)}
.cal{display:grid; grid-template-columns:repeat(6,1fr); gap:4px}
.cal span{font-size:14px; color:var(--muted); text-align:center; font-weight:700}
.track{position:relative; height:54px; border-radius:12px; background:var(--surface2); overflow:hidden}
.track .no{position:absolute; top:0; bottom:0; left:0; width:16.9%; background:var(--bad-bg); border-right:3px solid var(--bad); display:grid; place-items:center; color:var(--bad); font-weight:800; font-size:22px}
.track .go{position:absolute; top:8px; bottom:8px; background:var(--ok); border-radius:10px; display:grid; place-items:center; color:#fff; font-weight:800; font-size:20px; min-width:28px}
.rule{display:flex; flex-direction:column; gap:8px}
.rule div{background:var(--surface2); border-radius:12px; padding:10px 12px; display:grid; grid-template-columns:36px 1fr; gap:4px 10px; align-items:center; font-size:16px; line-height:1.25}
.rule .i{font-size:26px; grid-row:span 2; text-align:center}
.rule b{font-family:var(--display); font-size:20px}
.crops{display:flex; flex-direction:column; gap:10px}
.crop{display:grid; grid-template-columns:36px 1fr auto; gap:10px; align-items:center}
.crop .ic{font-size:28px; line-height:1; text-align:center}
.crop .nm{font-weight:700}
.meter{display:flex; gap:4px} .meter i{width:22px; height:14px; border-radius:4px; background:var(--surface2)}
.crop .lb{font-size:14px; color:var(--muted); grid-column:2 / 4; margin-top:-8px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips span{background:var(--ok-bg); color:var(--ok); border-radius:999px; padding:6px 12px; font-weight:700; font-size:15px}
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.tile{background:var(--surface2); border-radius:14px; padding:12px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; font-weight:700; font-size:16px; line-height:1.2}
.tile .ic{font-size:34px; position:relative; line-height:1}
.tile .ic.x::after{content:""; position:absolute; left:-4px; right:-4px; top:50%; height:4px; background:var(--bad); transform:rotate(-35deg); border-radius:2px}
.tile.warn{background:var(--warn-bg)}
.chart{width:100%; height:auto; display:block}
svg text{fill:var(--muted); font-family:var(--body); font-size:12px}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:14px; color:var(--muted)}
.legend span{display:flex; gap:5px; align-items:center} .legend i{width:14px; height:14px; border-radius:3px}
.span2{grid-column:1 / -1}
.calwrap{overflow-x:auto}
.calsvg{min-width:640px}
.cal-sum{display:flex; flex-wrap:wrap; gap:8px}
.cal-sum span{background:var(--surface2); border-radius:999px; padding:6px 12px; font-size:16px}
/* Como eu funciono */
.doc{max-width:760px}
.doc h1{font-size:34px; margin-bottom:6px}
.doc section{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; margin-top:16px; display:flex; flex-direction:column; gap:10px; scroll-margin-top:16px}
.doc section h2{font-size:23px}
.doc p, .doc li{font-size:17px; margin:0}
.doc ul{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:6px}
.doc .lead{color:var(--muted)}
.nums{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.nums div{background:var(--surface2); border-radius:12px; padding:12px}
.nums b{display:block; font-family:var(--display); font-size:24px; font-variant-numeric:tabular-nums}
.nums span{font-size:14px; color:var(--muted)}
.tbl{overflow:auto; max-height:320px; border:1px solid var(--line); border-radius:12px}
table{border-collapse:collapse; width:100%; font-size:15px; font-variant-numeric:tabular-nums}
th,td{padding:6px 10px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap}
th{position:sticky; top:0; background:var(--surface2); color:var(--muted); font-size:14px}
.pill{display:inline-block; padding:1px 8px; border-radius:999px; font-size:13px; font-weight:700; background:var(--bad-bg); color:var(--bad)}
.src{font-size:15px; color:var(--muted)}
@media (max-width:520px){ .who h1{font-size:25px} .find{top:8px; left:8px; right:8px} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#mapa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-9"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 15c0-3-2-5-6-5 0 3 2 5 6 5z"/></svg>Roça Certa</a>
  <nav><a href="#mapa" data-r="mapa">Mapa</a><a href="#minha-roca" data-r="minha-roca">Minha roça</a><a href="#como-funciona" data-r="como-funciona">Como eu funciono</a></nav>
</div></header>
<main id="view"></main>

<script>
const D = __DATA__;
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const CROP={milho:['🌽','Milho'],feijao:['🫘','Feijão'],mandioca:['🥔','Mandioca'],sorgo:['🌾','Sorgo'],fava:['🫛','Fava'],caju:['🌰','Caju'],gergelim:['🌿','Gergelim'],batata:['🍠','Batata-doce'],amendoim:['🥜','Amendoim'],algodao:['☁️','Algodão']};
const S={cod:null, px:null, view:'mapa', secao:null};
try{ const s=JSON.parse(localStorage.getItem('roca')||'null'); if(s&&D.nomes[s.cod]){S.cod=s.cod; S.px=s.px;} }catch(e){}
const $=q=>document.querySelector(q);
const nome=c=>D.nomes[c]||c;
const fmt=(n,d=0)=>n==null||!isFinite(n)?'–':n.toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});
const dl=i=>{const d=new Date(Date.UTC(2001,0,1+i)); return d.getUTCDate()+' '+MES[d.getUTCMonth()];};
const yi=y=>D.anos.indexOf(y);

/* ---------- chuva e regras ---------- */
const RC={};
function serie(cod){ return RC[cod]||(RC[cod]=Int16Array.from(D.rain[cod].split(','),v=>v?+v:0)); }
function season(cod,y){ const o=(y-1998)*181; return serie(cod).subarray(o,o+181); }
const trig=(P,d)=>d>=2&&(P[d]+P[d-1]+P[d-2])>=20;
function first(P,from){ for(let d=Math.max(from,2);d<181;d++) if(trig(P,d)) return d; return -1; }
function falso(P,p){ if(p<0) return null; let r=0; for(let i=p+1;i<=Math.min(p+30,180);i++){ r=P[i]<1?r+1:0; if(r>=10) return true; } return false; }
function hist(cod){ return D.anos.map(y=>{const P=season(cod,y), r1=first(P,0), r6=first(P,31); return {y,r1,r6,f1:falso(P,r1),f6:falso(P,r6),milho:D.anual[cod].milho[yi(y)]};}); }
function quart(a,p){ const b=[...a].sort((x,y)=>x-y), k=(b.length-1)*p, f=Math.floor(k); return Math.round(b[f]+(b[Math.min(f+1,b.length-1)]-b[f])*(k-f)); }

/* ---------- mapa ---------- */
let G=null;
function geo(){
  if(G) return G;
  let x0=180,x1=-180,y0=90,y1=-90; const each=(g,f)=>(g.type==='Polygon'?[g.coordinates]:g.coordinates).forEach(p=>p.forEach(r=>r.forEach(f)));
  D.geo.forEach(f=>each(f.g,([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}));
  const k=Math.cos((y0+y1)/2*Math.PI/180), W=1000, sc=W/((x1-x0)*k), H=(y1-y0)*sc;
  const pr=([x,y])=>((x-x0)*k*sc).toFixed(1)+','+((y1-y)*sc).toFixed(1);
  const paths=D.geo.map(f=>({c:f.c, d:(f.g.type==='Polygon'?[f.g.coordinates]:f.g.coordinates).map(p=>p.map(r=>'M'+r.map(pr).join('L')+'Z').join('')).join('')}));
  return G={W,H,paths};
}
function miniMap(cod){ const g=geo(); return `<svg class="mini" viewBox="0 0 ${g.W} ${g.H.toFixed(0)}" aria-hidden="true">${g.paths.map(p=>`<path d="${p.d}" class="${p.c===cod?'on':''}"/>`).join('')}</svg>`; }
const PIN=(x,y,s)=>`<g id="pin" transform="translate(${x},${y}) scale(${s})" pointer-events="none"><path d="M0 0 C-9 -14 -16 -20 -16 -30 A16 16 0 1 1 16 -30 C16 -20 9 -14 0 0Z" fill="var(--sun)" stroke="var(--surface)" stroke-width="3"/><circle cx="0" cy="-30" r="6" fill="var(--surface)"/></g>`;

let VB=null, anim=null;
function setVB(svg,to,ms=450){
  const from=VB||to; cancelAnimationFrame(anim);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches; const t0=performance.now();
  const step=t=>{ const k=reduce?1:Math.min(1,(t-t0)/ms), e=1-Math.pow(1-k,3); VB=from.map((v,i)=>v+(to[i]-v)*e); svg.setAttribute('viewBox',VB.join(' ')); const pin=svg.querySelector('#pin'); if(pin&&S.px) pin.setAttribute('transform',`translate(${S.px[0]},${S.px[1]}) scale(${VB[2]/1000})`); if(k<1) anim=requestAnimationFrame(step); };
  anim=requestAnimationFrame(step);
}

const V={};
V.mapa=()=>{
  const g=geo();
  return `
  <div class="steps"><div class="step ${S.cod?'':'on'}"><b>1</b>Toque onde fica sua roça</div><div class="step ${S.cod?'on':''}"><b>2</b>Confirme</div><div class="step"><b>3</b>Veja sua roça</div></div>
  <div class="mapbox">
    <svg id="mapa" viewBox="0 0 ${g.W} ${g.H.toFixed(0)}" role="img" aria-label="Mapa do Ceará. Toque no lugar da sua roça.">${g.paths.map(p=>`<path d="${p.d}" data-c="${p.c}"><title>${nome(p.c)}</title></path>`).join('')}</svg>
    <div class="find"><input id="busca" list="muns" placeholder="Ou digite sua cidade" aria-label="Digite o nome da sua cidade" autocomplete="off"><datalist id="muns">${Object.values(D.nomes).sort((a,b)=>a.localeCompare(b,'pt')).map(n=>`<option value="${n}">`).join('')}</datalist></div>
    <div class="sheet" id="sheet" hidden><p>Sua roça fica em<br><b id="sheet-n"></b></p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="outro">Mudar</button><a class="btn" href="#minha-roca">Ver minha roça</a></div></div>
  </div>
  <p class="hint">Toque no mapa para marcar. Pode tocar de novo para ajustar.</p>`;
};
V.mapa.after=()=>{
  const svg=$('#mapa'), g=geo(); VB=null;
  const full=[0,0,g.W,g.H];
  const marcar=(cod,px)=>{
    S.cod=cod; S.px=px; try{localStorage.setItem('roca',JSON.stringify({cod,px}));}catch(e){}
    svg.querySelectorAll('path.on').forEach(p=>p.classList.remove('on'));
    const el=svg.querySelector(`path[data-c="${cod}"]`); el.classList.add('on');
    const b=el.getBBox(), s=Math.max(b.width,b.height*g.W/g.H)*3.2, w=Math.max(s,160), h=w*g.H/g.W;
    let pin=svg.querySelector('#pin'); if(pin) pin.remove();
    svg.insertAdjacentHTML('beforeend',PIN(px[0],px[1],(VB||full)[2]/1000));
    setVB(svg,[b.x+b.width/2-w/2, b.y+b.height/2-h/2, w, h]);
    $('#sheet').hidden=false; $('#sheet-n').textContent=nome(cod);
    document.querySelectorAll('.step').forEach((s,i)=>s.classList.toggle('on',i===1));
  };
  svg.addEventListener('click',e=>{ const p=e.target.closest('path[data-c]'); if(!p) return;
    const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY; const q=pt.matrixTransform(svg.getScreenCTM().inverse()); marcar(p.dataset.c,[q.x,q.y]); });
  $('#busca').addEventListener('change',e=>{ const v=e.target.value.trim().toLowerCase(); const cod=Object.keys(D.nomes).find(c=>D.nomes[c].toLowerCase()===v); if(!cod) return;
    const b=svg.querySelector(`path[data-c="${cod}"]`).getBBox(); marcar(cod,[b.x+b.width/2,b.y+b.height/2]); });
  $('#outro').onclick=()=>{ $('#sheet').hidden=true; svg.querySelectorAll('path.on').forEach(p=>p.classList.remove('on')); const pin=svg.querySelector('#pin'); if(pin) pin.remove(); setVB(svg,full); document.querySelectorAll('.step').forEach((s,i)=>s.classList.toggle('on',i===0)); };
  if(S.cod&&S.px){ VB=full; marcar(S.cod,S.px); }
};

const ICO={
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  rain:'<svg viewBox="0 0 24 24"><path d="M7 15a4 4 0 1 1 1-7.9A5.5 5.5 0 0 1 18.5 8 3.5 3.5 0 0 1 18 15z"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/></svg>',
  cloud:'<svg viewBox="0 0 24 24"><path d="M7 18a4 4 0 1 1 1-7.9A5.5 5.5 0 0 1 18.5 11 3.5 3.5 0 0 1 18 18z"/></svg>'};

function cardInverno(cod){
  const oni=D.oni_ultimo.valor;
  const [cls,ic,t1,t2]= oni>=1?['s-bad',ICO.sun,'Risco de seca','O Pacífico está muito quente (El Niño forte)']: oni>=.5?['s-warn',ICO.sun,'Atenção','El Niño fraco no Pacífico']: oni<=-.5?['s-ok',ICO.rain,'Chance de bom inverno','La Niña no Pacífico']:['s-idle',ICO.cloud,'Sem sinal forte','Pacífico neutro'];
  const an=Object.entries(D.oni_jas).filter(([a,v])=>v>=1&&+a+1<=2025).map(([a])=>+a+1);
  const A=D.anual[cod];
  const cols=an.map(y=>{const v=A.fm[yi(y)]; const h=Math.min(v,150)/150*100; const c=v<70?'var(--bad)':v<90?'var(--warn)':'var(--rain)';
    return `<div><div class="col"><u style="bottom:${100/150*100}%"></u><i style="height:${h}%;background:${c}"></i></div><b>${v}%</b><small>${y}</small></div>`;}).join('');
  return `<div class="card"><div class="card-h"><h2>Inverno 2027</h2><a class="why" href="#como-funciona" data-sec="inverno" aria-label="Por que esse aviso?">?</a></div>
    <div class="big ${cls}"><div class="dot">${ic}</div><div><strong>${t1}</strong><span>${t2}</span></div></div>
    <p class="cap">Chuva aqui nos anos parecidos (tracejado = normal):</p>
    <div class="analog">${cols}</div></div>`;
}
function cardPlantar(cod){
  const H=hist(cod).filter(h=>h.y<=2025&&h.r6>=0);
  const a=quart(H.map(h=>h.r6),.25), b=quart(H.map(h=>h.r6),.75);
  const L=i=>(i/181*100).toFixed(1)+'%';
  return `<div class="card"><div class="card-h"><h2>Quando plantar?</h2><a class="why" href="#como-funciona" data-sec="plantar" aria-label="Por que esperar fevereiro?">?</a></div>
    <div><div class="cal">${MES.slice(0,6).map(m=>`<span>${m}</span>`).join('')}</div>
    <div class="track" role="img" aria-label="Não plante em janeiro. A hora de plantar costuma chegar entre ${dl(a)} e ${dl(b)}."><div class="no">✋</div><div class="go" style="left:${L(a)};width:${L(Math.max(b-a,10))}">🌱</div></div></div>
    <div class="rule"><div><span class="i">✋</span><b>Janeiro</b><span>Não plante na 1ª chuva</span></div><div><span class="i">🌱</span><b>${dl(a)} a ${dl(b)}</b><span>Sua hora costuma chegar</span></div><div><span class="i">🌧️</span><b>20 mm em até 3 dias</b><span>É a chuva de plantar</span></div></div></div>`;
}
/* ---------- calendário proposto ---------- */
const FASE={p:['var(--sun)','Preparo'],g:['var(--ok)','Planta crescendo'],f:['var(--warn)','Florada (precisa de chuva)'],c:['var(--accent)','Colheita'],r:['var(--rain)','Comida pro gado'],m:['var(--muted)','Palhada no chão']};
function proposta(cod){
  const H=hist(cod).filter(h=>h.y<=2025&&h.r6>=0), a=quart(H.map(h=>h.r6),.25), b=quart(H.map(h=>h.r6),.75);
  const C=D.culturas[cod]||{}, nino=D.oni_ultimo.valor>=1, milhoFraco=C.milho&&C.milho[0]<.3;
  const P=61+a, FIM=365; // dias contados a partir de 1º/nov/2026
  const rows=[];
  rows.push({ic:'🛠️',nm:'Solo',sub:'preparo e cuidado',seg:[[13,61,'m','Sem fogo'],[61,P,'p','Sementes'],[P+15,P+42,'p','Capina'],[P+120,FIM,'m','Palhada, tirar restos verdes']]});
  rows.push({ic:'🫘',nm:'Caupi precoce',sub:'leguminosa, 70 dias',seg:[[P,P+35,'g'],[P+35,P+60,'f'],[P+60,P+75,'c','Colher']]});
  if(nino||milhoFraco) rows.push({ic:'🌾',nm:'Sorgo',sub:'no lugar do milho',seg:[[P,P+55,'g'],[P+55,P+85,'f'],[P+85,P+115,'c','Colher'],[P+115,P+165,'r','Rebrota']]});
  else rows.push({ic:'🌽',nm:'Milho',sub:'110 dias',seg:[[P,P+50,'g'],[P+50,P+80,'f'],[P+80,P+110,'c','Colher']]});
  rows.push({ic:'🌿',nm:'Guandu',sub:'aduba o solo',seg:[[P,P+90,'g'],[P+90,P+140,'f'],[P+140,P+175,'c','Grão'],[P+175,FIM,'r','Corte pro gado']]});
  if(C.mandioca&&C.mandioca[0]>=.3) rows.push({ic:'🥔',nm:'Mandioca',sub:'colhe em 12–18 meses',seg:[[P,FIM,'g','Cresce até o ano que vem →']]});
  rows.push({ic:'🌵',nm:'Palma',sub:'reserva da seca',seg:[[13,61,'p','Plantar'],[61,273,'g'],[273,FIM,'r','Corte pro gado']]});
  return {rows,P,a,b,cereal:(nino||milhoFraco)?'sorgo':'milho',nino,milhoFraco};
}
function cardCalendario(cod){
  const pr=proposta(cod), W=760, L=150, R=8, top=46, rh=38, H=top+pr.rows.length*rh+8;
  const X=d=>L+(W-L-R)*Math.min(d,365)/365;
  const meses=['nov','dez','jan','fev','mar','abr','mai','jun','jul','ago','set','out'], ini=[0,30,61,92,120,151,181,212,242,273,304,334];
  let g='';
  g+=`<rect x="${X(92)}" y="${top-6}" width="${X(212)-X(92)}" height="${H-top}" fill="var(--rain)" opacity=".09"/><text x="${X(92)+4}" y="${top-12}" style="fill:var(--rain);font-weight:700">chuvas (fev–mai)</text>`;
  ini.forEach((d,i)=>{ g+=`<line x1="${X(d)}" x2="${X(d)}" y1="${top-6}" y2="${H}" stroke="var(--line)"/><text x="${X(d)+4}" y="14" style="font-weight:700">${meses[i]}</text>${i===2?`<text x="${X(d)+4}" y="${top-12}">2027</text>`:''}`; });
  pr.rows.forEach((r,i)=>{ const y=top+i*rh;
    g+=`<text x="0" y="${y+16}" style="font-size:20px">${r.ic}</text><text x="30" y="${y+13}" style="fill:var(--ink);font-weight:700;font-size:14px">${r.nm}</text><text x="30" y="${y+28}" style="font-size:11.5px">${r.sub}</text>`;
    r.seg.forEach(([s,e,t,lb])=>{ const x=X(s), w=Math.max(2,X(e)-X(s)); const col=FASE[t][0];
      g+=`<rect x="${x}" y="${y+4}" width="${w}" height="${rh-12}" rx="6" fill="${col}" opacity="${t==='m'||t==='p'?.35:.85}"><title>${r.nm}: ${lb||FASE[t][1]}</title></rect>`;
      if(lb && w>lb.length*5.8+8) g+=`<text x="${x+5}" y="${y+rh/2+2}" style="fill:${t==='m'||t==='p'?'var(--ink)':'#fff'};font-weight:700;font-size:11.5px">${lb}</text>`; });
  });
  g+=`<line x1="${X(pr.P)}" x2="${X(pr.P)}" y1="${top-6}" y2="${H}" stroke="var(--ok)" stroke-width="2.5" stroke-dasharray="5 4"/>`;
  g+=`<line x1="${X(13)}" x2="${X(13)}" y1="${top-6}" y2="${H}" stroke="var(--ink)" stroke-width="2"/><text x="${X(13)+4}" y="${top+2}" style="fill:var(--ink);font-weight:700">hoje</text>`;
  const leg=['p','g','f','c','r','m'].map(t=>`<span><i style="background:${FASE[t][0]};opacity:${t==='m'||t==='p'?.45:.9}"></i>${FASE[t][1]}</span>`).join('');
  return `<div class="card span2"><div class="card-h"><h2>Seu ano na roça: proposta</h2><a class="why" href="#como-funciona" data-sec="calendario" aria-label="Como a proposta foi montada?">?</a></div>
    <div class="cal-sum"><span>🌱 Plantio a partir de <b>${dl(pr.a)}</b></span><span>${pr.cereal==='sorgo'?'🌾 <b>Sorgo</b> no lugar do milho':'🌽 Milho mantido'}</span><span>🔄 Ano que vem: troque as áreas</span></div>
    <div class="calwrap"><svg class="chart calsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calendário de novembro de 2026 a outubro de 2027 com plantio a partir de ${dl(pr.a)}">${g}</svg></div>
    <div class="legend">${leg}<span><i style="background:transparent;border:2px dashed var(--ok)"></i>dia do plantio</span></div></div>`;
}

function cardCulturas(cod){
  const C=D.culturas[cod]||{};
  const ks=Object.keys(C).sort((x,y)=>C[y][0]-C[x][0]);
  const rows=ks.map(k=>{const r=C[k][0]; const n=r>=.45?3:r>=.3?2:1; const col=n===3?'var(--ok)':n===2?'var(--warn)':'var(--bad)'; const lb=n===3?'Aguenta bem':n===2?'Sofre':'Perde muito';
    return `<div class="crop"><span class="ic" aria-hidden="true">${CROP[k][0]}</span><span class="nm">${CROP[k][1]}</span><span class="meter" role="img" aria-label="${lb}">${[1,2,3].map(i=>`<i style="${i<=n?'background:'+col:''}"></i>`).join('')}</span><span class="lb">${lb} na seca</span></div>`;}).join('');
  return `<div class="card"><div class="card-h"><h2>O que aguenta seca aqui?</h2><a class="why" href="#como-funciona" data-sec="culturas" aria-label="Como foi medido?">?</a></div>
    ${rows?`<div class="crops">${rows}</div>`:'<p class="cap">Sem histórico suficiente neste município.</p>'}
    <p class="cap">Boas para o sertão:</p><div class="chips"><span>🌾 Sorgo</span><span>🫘 Caupi precoce</span><span>🌵 Palma</span><span>🌿 Guandu</span></div></div>`;
}
function cardAgora(cod){
  const R=D.relevo[cod]||[0,0,0], ladeira=R[2]>.25||R[1]>5;
  return `<div class="card"><div class="card-h"><h2>Agora: entressafra</h2><a class="why" href="#como-funciona" data-sec="entressafra" aria-label="Por que essas dicas?">?</a></div>
    <div class="tiles">
      <div class="tile"><span class="ic x" aria-hidden="true">🔥</span>Não queime</div>
      <div class="tile"><span class="ic" aria-hidden="true">🍂</span>Deixe a palhada</div>
      <div class="tile"><span class="ic x" aria-hidden="true">🌽</span>Tire o milho que brotou</div>
      <div class="tile"><span class="ic" aria-hidden="true">🌵</span>Guarde comida pro gado</div>
      ${ladeira?'<div class="tile warn" style="grid-column:1 / -1"><span class="ic" aria-hidden="true">⛰️</span>Terreno inclinado: plante em nível e cubra o solo</div>':''}
    </div></div>`;
}
function cardChuva(cod){
  const v=D.anual[cod].fm, n=v.length, W=640,H=170,L=30,B=22,T=8, bw=(W-L-6)/n, ymax=200;
  const Y=x=>T+(H-T-B)*(1-Math.min(x,ymax)/ymax);
  let bars='', secos=0;
  v.forEach((x,i)=>{ if(x==null) return; if(x<70) secos++; const c=x<70?'var(--bad)':x<90?'var(--warn)':'var(--rain)'; bars+=`<rect x="${(L+i*bw+1).toFixed(1)}" y="${Y(x).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${(H-B-Y(x)).toFixed(1)}" rx="2" fill="${c}"><title>${D.anos[i]}: ${x}% do normal</title></rect>`; });
  const lab=[1998,2005,2012,2019,2026].map(y=>`<text x="${(L+yi(y)*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${y}</text>`).join('');
  return `<div class="card span2"><div class="card-h"><h2>Como foi o inverno aqui</h2><a class="why" href="#como-funciona" data-sec="chuva" aria-label="De onde vem essa chuva?">?</a></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chuva de fevereiro a maio de cada ano, de 1998 a 2026, comparada ao normal. ${secos} anos secos.">
      <line x1="${L}" x2="${W}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".5"/><text x="0" y="${Y(100)+4}">normal</text>${bars}${lab}</svg>
    <div class="legend"><span><i style="background:var(--bad)"></i>ano seco</span><span><i style="background:var(--warn)"></i>pouco abaixo</span><span><i style="background:var(--rain)"></i>normal ou mais</span><span><b style="color:var(--bad)">${secos}</b>&nbsp;anos secos em ${v.filter(x=>x!=null).length}</span></div></div>`;
}
V['minha-roca']=()=>{
  if(!S.cod) return `<div class="card" style="max-width:520px"><h2>Primeiro, marque sua roça</h2><p class="cap">Toque no mapa onde fica sua roça.</p><a class="btn" href="#mapa">Abrir o mapa</a></div>`;
  const c=S.cod;
  return `<div class="who"><div class="who-l">${miniMap(c)}<div><div class="sub">Sua roça em</div><h1>${nome(c)}</h1></div></div><a class="btn ghost" href="#mapa">Mudar lugar</a></div>
  <div class="grid">${cardInverno(c)}${cardPlantar(c)}${cardCalendario(c)}${cardCulturas(c)}${cardAgora(c)}${cardChuva(c)}</div>`;
};

V['como-funciona']=()=>{
  const c=S.cod||'2311306', H=hist(c);
  const f1=H.filter(h=>h.f1).length, f6=H.filter(h=>h.f6).length;
  const rows=H.slice().reverse().map(h=>`<tr><td>${h.y}</td><td>${h.r1<0?'–':dl(h.r1)} ${h.f1?'<span class="pill">falso início</span>':''}</td><td>${h.r6<0?'–':dl(h.r6)} ${h.f6?'<span class="pill">falso início</span>':''}</td><td>${h.milho==null?'–':h.milho>2?'+200%':fmt(h.milho*100)+'%'}</td></tr>`).join('');
  const C=D.culturas[c]||{};
  const crows=Object.keys(C).sort((x,y)=>C[y][0]-C[x][0]).map(k=>`<tr><td>${CROP[k][1]}</td><td>${fmt(C[k][0]*100)}%</td><td>${C[k][1]} de ${C[k][2]}</td></tr>`).join('');
  return `<div class="doc">
  <h1>Como eu funciono</h1>
  <p class="lead">De onde vem cada aviso da tela "Minha roça". Exemplos com ${nome(c)}${S.cod?'':' (marque sua roça para ver a sua)'}.</p>

  <section id="sec-inverno"><h2>Inverno 2027</h2>
    <p>O aviso vem da temperatura do oceano Pacífico (índice ONI, da NOAA). Quando o Pacífico esquenta (El Niño), a chuva do Ceará costuma diminuir de fevereiro a maio.</p>
    <div class="nums"><div><b>+${fmt(D.oni_ultimo.valor,2)} °C</b><span>ONI de ${D.oni_ultimo.mes.slice(5,7)}/${D.oni_ultimo.mes.slice(0,4)} (acima de +1,0 = El Niño forte)</span></div><div><b>−32%</b><span>chuva média de fev–mai nas 7 quadras após El Niño forte desde 1983</span></div><div><b>6 de 7</b><span>dessas quadras com milho 43% a 64% abaixo do normal no Ceará</span></div></div>
    <p>"Anos parecidos" são os que vieram depois de um El Niño forte em julho–setembro: 1998, 2016 e 2024. A barra mostra a chuva de fevereiro a maio no seu município, comparada ao normal de 1998–2025.</p>
    <p><b>Limite:</b> em novembro, o oceano acerta o tipo de inverno em cerca de 4 a cada 10 anos (no acaso seriam 3). Por isso é um aviso para se preparar, não uma certeza. A FUNCEME divulga o prognóstico oficial no começo do ano.</p></section>

  <section id="sec-plantar"><h2>Quando plantar?</h2>
    <p><b>Chuva de plantar</b> = 20 mm ou mais somados em até 3 dias. <b>Falso início</b> = depois dessa chuva, 10 dias seguidos quase sem chuva no primeiro mês. É o que mata a planta nova.</p>
    <p>Testamos várias regras com 28 anos de chuva por satélite nos 184 municípios. A melhor foi simples: <b>esperar a chuva de plantar, mas só a partir de 1º de fevereiro</b>.</p>
    <div class="nums"><div><b>7,8% → 3,0%</b><span>chance de perder tudo, plantar na 1ª chuva x esperar fevereiro</span></div><div><b>34% → 10%</b><span>a mesma chance nos anos de seca</span></div><div><b>89% → 11%</b><span>municípios que perderam tudo em 2010</span></div></div>
    <p>A faixa verde mostra entre que datas a chuva de plantar costuma chegar depois de 1º de fevereiro (metade dos anos fica dentro dela). Em ${nome(c)}, plantando na 1ª chuva houve falso início em ${f1} anos; esperando fevereiro, em ${f6}.</p>
    <div class="tbl"><table><thead><tr><th>Ano</th><th>1ª chuva de plantar</th><th>Esperando fevereiro</th><th>Milho no ano</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="src">Chuva: NASA/JAXA GPM IMERG V07 diário (0,1°, cerca de 10 km), via NASA POWER, média do município. Milho: IBGE Produção Agrícola Municipal, comparado à tendência do município.</p></section>

  <section id="sec-calendario"><h2>Seu ano na roça: proposta</h2>
    <p>É uma proposta de partida para conversar com o técnico, não uma receita. Ela junta o que as outras telas mostram:</p>
    <ul><li><b>Dia do plantio:</b> o começo da faixa verde de "Quando plantar?" (a data em que a chuva de plantar chega depois de 1º de fevereiro em 1 de cada 4 anos).</li>
    <li><b>Sorgo no lugar do milho</b> quando há El Niño forte ou quando o milho "perde muito" no município. Senão, o milho fica.</li>
    <li><b>Caupi precoce e guandu</b> sempre entram: são leguminosas, adubam o solo e ajudam a cultura do ano seguinte. Por isso o "troque as áreas" no ano que vem.</li>
    <li><b>Mandioca</b> só aparece quando o município já planta e ela não "perde muito" na seca.</li>
    <li><b>Palma</b> é a reserva do gado: raquetes plantadas no fim da seca e corte de agosto a outubro.</li></ul>
    <p>As fases usam ciclos médios de cultivares comuns no semiárido (caupi precoce ~70 dias, sorgo ~115, milho ~110, guandu ~6 meses). A florada é marcada em amarelo porque é quando a planta mais sofre com veranico. A faixa azul é a época das chuvas (fevereiro a maio).</p></section>

  <section id="sec-culturas"><h2>O que aguenta seca aqui?</h2>
    <p>Para cada cultura plantada no município, olhamos o rendimento por hectare de 2001 a 2025 (IBGE) e comparamos cada ano com a tendência. Depois tiramos a média dos <b>3 piores anos</b>.</p>
    <ul><li><b>Aguenta bem</b> (3 barras): nos piores anos ainda colhe 45% ou mais do normal.</li><li><b>Sofre</b> (2 barras): colhe entre 30% e 45%.</li><li><b>Perde muito</b> (1 barra): colhe menos de 30%.</li></ul>
    ${crows?`<div class="tbl"><table><thead><tr><th>Cultura</th><th>Colheita nos piores anos</th><th>Anos com perda de mais da metade</th></tr></thead><tbody>${crows}</tbody></table></div>`:''}
    <p>"Boas para o sertão" vem do estudo de aptidão da FAO (GAEZ) para quem usa pouco adubo e máquina: sorgo, mandioca, guandu e feijão ficam no topo. Caupi precoce e palma entram pela tolerância à seca. Plantar leguminosa (feijão, guandu) antes do milho costuma aumentar a colheita seguinte em cerca de 20%.</p></section>

  <section id="sec-entressafra"><h2>Agora: entressafra</h2>
    <ul><li><b>Não queime:</b> 72% dos focos de fogo do Ceará acontecem de outubro a dezembro (satélite VIIRS). Roçar e queimar sem descanso levou metade do carbono do solo em 10 anos, em estudo feito em Sobral.</li>
    <li><b>Deixe a palhada:</b> a chuva do inverno chega forte (até 80 mm por hora) e leva a terra descoberta.</li>
    <li><b>Tire o milho que brotou</b> (tiguera) e restos verdes: no Ceará faz calor o ano todo e a lagarta-do-cartucho passa de um inverno para o outro nessas plantas.</li>
    <li><b>Comida para o gado:</b> palma, sorgo forrageiro, feno ou silagem para o fim da seca.</li>
    <li><b>Terreno inclinado</b> aparece quando o município tem declividade média acima de 5° ou mais de 25% da área ondulada (relevo NASA SRTM/NASADEM, 30 m). Em ${nome(c)}: ${fmt((D.relevo[c]||[0,0])[1],1)}° de declividade média.</li></ul></section>

  <section id="sec-chuva"><h2>Como foi o inverno aqui</h2>
    <p>Cada barra é a chuva de fevereiro a maio de um ano, comparada ao normal (a mediana de 1998–2025). Vermelho = menos de 70% do normal; amarelo = 70% a 90%.</p>
    <p class="src">Fonte: GPM IMERG V07 diário via NASA POWER, dados até 14/set/2026.</p></section>

  <section id="sec-dados"><h2>Limites</h2>
    <ul><li>A chuva é a média do município (pixel de cerca de 10 km). Não enxerga a chuva de uma roça só.</li><li>Previsão de inverno é chance, nunca certeza.</li><li>O app não decide o Garantia-Safra nem substitui a EMATERCE: só ajuda a se preparar mais cedo.</li></ul></section>
  </div>`;
};
V['como-funciona'].after=()=>{ if(S.secao){ const el=document.getElementById('sec-'+S.secao); if(el) el.scrollIntoView(); S.secao=null; } else scrollTo(0,0); };
V['minha-roca'].after=()=>scrollTo(0,0);

/* ---------- rotas ---------- */
const ROTAS=['mapa','minha-roca','como-funciona'];
function render(){
  const h=location.hash.slice(1); S.view=ROTAS.includes(h)?h:(S.cod?'minha-roca':'mapa');
  document.querySelectorAll('.bar nav a').forEach(a=>{ if(a.dataset.r===S.view) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $('#view').innerHTML=V[S.view](); V[S.view].after&&V[S.view].after();
}
document.addEventListener('click',e=>{ const a=e.target.closest('[data-sec]'); if(a){ S.secao=a.dataset.sec; if(location.hash==='#como-funciona'){ e.preventDefault(); render(); } } });
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
